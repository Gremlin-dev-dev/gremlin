
<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GREMLIN — Test Signup</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #eee; }
    input { display: block; width: 100%; padding: 10px; margin: 8px 0; font-size: 16px; }
    button { padding: 10px 20px; font-size: 16px; }
    #result { margin-top: 16px; white-space: pre-wrap; background: #222; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>Test /signup</h2>
  <input id="username" placeholder="username">
  <input id="password" placeholder="password" type="text">
  <button onclick="testSignup()">Sign Up</button>
  <div id="result"></div>

  <script>
    async function testSignup() {
      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/signup", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ username, password })
      });

      const data = await res.json();
      document.getElementById("result").textContent =
        "Status: " + res.status + "\n" + JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
